<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Vitor Mateus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Painel<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH/CBAQAAAALAAAAABAAEAAAICRAEAOw==" alt="" style="display:block; width:18px; height:18px; margin-left:10px; opacity:0" aria-hidden="true" /> — Vitor Mateus</h1>
      <div id="user" class="user">
        <span id="user-login" class="user-login"></span>
        <button id="btn-logout" class="btn btn-sm btn-ghost">Sair</button>
      </div>
    </header>

    <main class="container">
      <section id="login" class="card">
        <h2>Acesso restrito</h2>
        <p class="hint">
          Cole seu Personal Access Token do GitHub com o escopo <code>repo</code>.<br />
          Sem cadastro — você usa as próprias credenciais da conta.
        </p>
        <form id="form-login" class="form">
          <label for="pat">Token</label>
          <input id="pat" type="password" placeholder="ghp_..." autocomplete="off" required />
          <button type="submit" class="btn btn-primary">Entrar no painel</button>
        </form>
      </section>

      <section id="dashboard" class="hidden">
        <div class="toolbar">
          <button id="btn-add-cat" class="btn btn-primary">+ Categoria</button>
          <span class="status" id="status"></span>
        </div>
        <div id="categories"></div>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div id="modal-backdrop" class="modal__backdrop"></div>
      <div class="modal__content">
        <header class="modal__header">
          <h3 id="modal-title">Editar</h3>
          <button id="modal-close" class="btn btn-sm btn-ghost">Fechar</button>
        </header>
        <div id="modal-body" class="modal__body"></div>
        <footer class="modal__footer">
          <button id="modal-cancel" class="btn btn-sm btn-ghost">Cancelar</button>
          <button id="modal-save" class="btn btn-sm btn-primary">Salvar alterações</button>
        </footer>
      </div>
    </div>
  </div>
  <script src="app.fix.js"></script>
</body>
</html>
