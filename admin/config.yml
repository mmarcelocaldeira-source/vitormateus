backend:
  name: github
  repo: mmarcelocaldeira-source/vitormateus
  branch: main
  base_url: https://decap-oauth-vitormateus.mmarcelocaldeira.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "assets"
public_folder: "assets"
site_url: https://mmarcelocaldeira-source.github.io/vitormateus/
display_url: https://mmarcelocaldeira-source.github.io/vitormateus/
logo_url: https://mmarcelocaldeira-source.github.io/vitormateus/assets/home/stairs-03.jpg
locale: pt

collections:
  - name: categorias
    label: Categorias
    label_singular: Categoria
    files:
      - file: data/categories/arquitetura.json
        label: Arquitetura
        name: arquitetura
        format: json
        fields:
          - { label: Nome da categoria, name: label, widget: string }
          - { label: Caminho, name: path, widget: hidden, default: "/arquitetura" }
          - { label: Título da página, name: title, widget: string }
          - { label: Subtítulo, name: subtitle, widget: string }
          - { label: Texto de introdução, name: intro, widget: text }
          - { label: Estatísticas, name: stats, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Projetos
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: Slug (URL — sem espaços, minúsculo, ex: casa-linha), name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen"] }
              - { label: Título, name: title, widget: string }
              - { label: Cliente, name: client, widget: string }
              - { label: Data, name: date, widget: string }
              - { label: Local, name: location, widget: string }
              - { label: Tipo, name: type, widget: string }
              - { label: "Nota (atalho — geralmente igual ao Tipo)", name: note, widget: string, required: false }
              - { label: Descrição, name: description, widget: text }
              - { label: Foto de capa, name: cover, widget: image }
              - { label: Alt da capa (acessibilidade), name: coverAlt, widget: string, required: false }
              - { label: Galeria de fotos, name: gallery, widget: list, field: { label: Imagem, name: image, widget: image } }

      - file: data/categories/gastronomia.json
        label: Gastronomia
        name: gastronomia
        format: json
        fields:
          - { label: Nome da categoria, name: label, widget: string }
          - { label: Caminho, name: path, widget: hidden, default: "/gastronomia" }
          - { label: Título da página, name: title, widget: string }
          - { label: Subtítulo, name: subtitle, widget: string }
          - { label: Texto de introdução, name: intro, widget: text }
          - { label: Estatísticas, name: stats, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Projetos
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: Slug (URL — sem espaços, minúsculo), name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen"] }
              - { label: Título, name: title, widget: string }
              - { label: Cliente, name: client, widget: string }
              - { label: Data, name: date, widget: string }
              - { label: Local, name: location, widget: string }
              - { label: Tipo, name: type, widget: string }
              - { label: Nota, name: note, widget: string, required: false }
              - { label: Descrição, name: description, widget: text }
              - { label: Foto de capa, name: cover, widget: image }
              - { label: Alt da capa, name: coverAlt, widget: string, required: false }
              - { label: Galeria de fotos, name: gallery, widget: list, field: { label: Imagem, name: image, widget: image } }

      - file: data/categories/retratos.json
        label: Retratos
        name: retratos
        format: json
        fields:
          - { label: Nome da categoria, name: label, widget: string }
          - { label: Caminho, name: path, widget: hidden, default: "/retratos" }
          - { label: Título da página, name: title, widget: string }
          - { label: Subtítulo, name: subtitle, widget: string }
          - { label: Texto de introdução, name: intro, widget: text }
          - { label: Estatísticas, name: stats, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Projetos
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: Slug, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen"] }
              - { label: Título, name: title, widget: string }
              - { label: Cliente, name: client, widget: string }
              - { label: Data, name: date, widget: string }
              - { label: Local, name: location, widget: string }
              - { label: Tipo, name: type, widget: string }
              - { label: Nota, name: note, widget: string, required: false }
              - { label: Descrição, name: description, widget: text }
              - { label: Foto de capa, name: cover, widget: image }
              - { label: Alt da capa, name: coverAlt, widget: string, required: false }
              - { label: Galeria de fotos, name: gallery, widget: list, field: { label: Imagem, name: image, widget: image } }

      - file: data/categories/autoriais.json
        label: Autorais
        name: autoriais
        format: json
        fields:
          - { label: Nome da categoria, name: label, widget: string }
          - { label: Caminho, name: path, widget: hidden, default: "/autoriais" }
          - { label: Título da página, name: title, widget: string }
          - { label: Subtítulo, name: subtitle, widget: string }
          - { label: Texto de introdução, name: intro, widget: text }
          - { label: Estatísticas, name: stats, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Projetos
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: Slug, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen"] }
              - { label: Título, name: title, widget: string }
              - { label: Cliente, name: client, widget: string }
              - { label: Data, name: date, widget: string }
              - { label: Local, name: location, widget: string }
              - { label: Tipo, name: type, widget: string }
              - { label: Nota, name: note, widget: string, required: false }
              - { label: Descrição, name: description, widget: text }
              - { label: Foto de capa, name: cover, widget: image }
              - { label: Alt da capa, name: coverAlt, widget: string, required: false }
              - { label: Galeria de fotos, name: gallery, widget: list, field: { label: Imagem, name: image, widget: image } }
